[package]
name = "mailflow-desktop"
version = "0.1.0"
description = "Mailflow for macOS"
authors = ["Mailflow contributors"]
edition = "2024"
rust-version = "1.85"

[build-dependencies]
serde_json = "1.0.151"
tauri-build = { version = "2.5.6", features = [] }
url = "2.5.8"

[dependencies]
aes-gcm = "0.10.3"
getrandom = "0.3.4"
hex = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1.49.0", features = ["macros", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString", "NSValue"] }
objc2-user-notifications = "0.3.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
base64 = "0.22.1"
minisign-verify = "0.2.5"
tempfile = "3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
