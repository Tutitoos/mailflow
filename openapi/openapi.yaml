openapi: 3.1.0
info:
  title: Mailflow API
  version: 0.1.0
  description: Stable public contract shared by the web, desktop and future Swift clients.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Canonical Mailflow user for the authenticated token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/sync:
    post:
      operationId: synchronizeAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Synchronization queued or already pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRunAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/refresh:
    post:
      operationId: refreshGoogleAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account credentials refreshed without exposing provider tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}:
    delete:
      operationId: disconnectAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Local access disabled and remote revocation attempted
          content:
            application/json:
              schema:
                type: object
                required: [account, remoteRevoked]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  remoteRevoked: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /oauth/google/status:
    get:
      operationId: getGoogleOAuthStatus
      responses:
        "200":
          description: Per-installation Google OAuth capability
          content:
            application/json:
              schema:
                type: object
                required: [configured, setup]
                properties:
                  configured: { type: boolean }
                  setup: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
  /oauth/google/start:
    post:
      operationId: startGoogleOAuth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reconsent: { type: boolean, default: false }
      responses:
        "200":
          description: Short-lived single-use authorization transaction
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /oauth/google/callback:
    get:
      operationId: completeGoogleOAuth
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "303":
          description: Connection completed and browser redirected to account settings
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /events:
    get:
      operationId: streamEvents
      description: Upgrade to an authenticated WebSocket. Reconnect with the last acknowledged cursor to replay missed events.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+$"
      responses:
        "101": { description: WebSocket event stream using EventEnvelope messages }
        "401": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /threads:
    get:
      operationId: listThreads
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPage"
  /threads/{threadId}:
    get:
      operationId: getThread
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation and messages
        default: { $ref: "#/components/responses/Problem" }
  /search:
    get:
      operationId: searchMail
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Search results }
  /actions:
    post:
      operationId: createMailAction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Action accepted }
        default: { $ref: "#/components/responses/Problem" }
  /drafts:
    post:
      operationId: saveDraft
      responses:
        "200": { description: Draft saved }
  /send:
    post:
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Message queued for delivery }
        default: { $ref: "#/components/responses/Problem" }
  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      description: Streams an authenticated cached attachment. Expired entries return a recovery-required problem so the provider can be queried again.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string, example: bytes=0-1023 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Complete attachment stream
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            ETag: { schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Requested single byte range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "304": { description: Cached representation is unchanged }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "416": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /translations/{locale}:
    get:
      operationId: getTranslations
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string, enum: [en, es] }
      responses:
        "200": { description: Translation catalog with English fallback }
  /admin/status:
    get:
      operationId: getAdminStatus
      responses:
        "200": { description: Operational status }
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      responses:
        "200": { description: Internal metric series }
  /admin/logs:
    get:
      operationId: getAdminLogs
      responses:
        "200": { description: Redacted structured logs }
  /admin/sentry:
    get:
      operationId: getSentryIssues
      responses:
        "200": { description: Grouped Sentry issues }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CurrentUser:
      type: object
      required: [id, email, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        locale: { type: string, enum: [en, es] }
    Account:
      type: object
      required: [id, provider, remoteId, displayName, capabilities, syncState, disabledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, microsoft, imap] }
        remoteId: { type: string }
        displayName: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        syncState: { type: string, enum: [pending, syncing, idle, error, disabled] }
        disabledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SyncRunAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, already_queued] }
        runId: { type: string, format: uuid }
    EventEnvelope:
      type: object
      required: [version, cursor, type, timestamp, payload]
      properties:
        version: { type: integer, const: 1 }
        cursor: { type: string, pattern: "^[0-9]+-[0-9]+$" }
        type:
          type: string
          enum: [mail.changed, sync.progress, draft.changed, admin.alert, system.status, system.resync_required]
        timestamp: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    ThreadPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, "null"] }
    Problem:
      type: object
      required: [type, title, status, code, detail, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
