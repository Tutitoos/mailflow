name: mailflow

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    restart: unless-stopped

  web:
    image: ${MAILFLOW_WEB_IMAGE:-mailflow-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_REPLAY_ENABLED: ${MAILFLOW_SENTRY_REPLAY_ENABLED:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${MAILFLOW_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=8080
    depends_on:
      api: { condition: service_healthy }
      auth: { condition: service_healthy }
    restart: unless-stopped

  auth:
    image: ${MAILFLOW_AUTH_IMAGE:-mailflow-auth:local}
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: "3001"
      BETTER_AUTH_URL: https://${MAILFLOW_DOMAIN}
      MAILFLOW_AUTH_AUDIENCE: mailflow-api
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      MAILFLOW_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      MAILFLOW_RECOVERY_CODE_FILE: /run/secrets/recovery_code
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      TRUSTED_ORIGINS: https://${MAILFLOW_DOMAIN}
    secrets: [better_auth_secret, bootstrap_token, postgres_password, recovery_code]
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${MAILFLOW_DOMAIN}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.services.auth.loadbalancer.server.port=3001
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  migrate:
    image: ${MAILFLOW_API_IMAGE:-mailflow-api:local}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: api
    command: [--migrate]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${MAILFLOW_API_IMAGE:-mailflow-api:local}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: api
    environment:
      MAILFLOW_API_ADDRESS: :8080
      MAILFLOW_CDN_ROOT: /data/cdn
      MAILFLOW_CDN_MAX_BYTES: 26214400
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      MAILFLOW_AUTH_AUDIENCE: mailflow-api
      MAILFLOW_AUTH_ISSUER: https://${MAILFLOW_DOMAIN}
      MAILFLOW_MASTER_KEY_FILE: /run/secrets/master_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      REDIS_ADDRESS: redis:6379
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
      GOOGLE_OAUTH_REDIRECT_URL: https://${MAILFLOW_DOMAIN}/api/v1/oauth/google/callback
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET_FILE: /run/secrets/microsoft_oauth_client_secret
      MICROSOFT_OAUTH_REDIRECT_URL: https://${MAILFLOW_DOMAIN}/api/v1/oauth/microsoft/callback
      MICROSOFT_OAUTH_AUTHORITY: ${MICROSOFT_OAUTH_AUTHORITY:-common}
      MAILFLOW_SENTRY_REPLAY_ENABLED: ${MAILFLOW_SENTRY_REPLAY_ENABLED:-false}
      MAILFLOW_ALERT_SMTP_HOST: ${MAILFLOW_ALERT_SMTP_HOST:-}
      MAILFLOW_ALERT_SMTP_PORT: ${MAILFLOW_ALERT_SMTP_PORT:-587}
      MAILFLOW_ALERT_SMTP_USERNAME: ${MAILFLOW_ALERT_SMTP_USERNAME:-}
      MAILFLOW_ALERT_SMTP_FROM: ${MAILFLOW_ALERT_SMTP_FROM:-}
      MAILFLOW_ALERT_SMTP_TO: ${MAILFLOW_ALERT_SMTP_TO:-}
      MAILFLOW_ALERT_SMTP_IMPLICIT_TLS: ${MAILFLOW_ALERT_SMTP_IMPLICIT_TLS:-false}
      MAILFLOW_ALERT_CONNECTED_ACCOUNT_FALLBACK: ${MAILFLOW_ALERT_CONNECTED_ACCOUNT_FALLBACK:-false}
      MAILFLOW_ALERT_SMTP_PASSWORD_FILE: /run/secrets/alert_smtp_password
    secrets: [alert_smtp_password, google_oauth_client_secret, master_key, microsoft_oauth_client_secret, postgres_password]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${MAILFLOW_DOMAIN}`) && (PathPrefix(`/api/v1`) || PathPrefix(`/sentry`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD, /usr/local/bin/api, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      auth: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - mailflow-cdn:/data/cdn
    restart: unless-stopped

  worker:
    image: ${MAILFLOW_WORKER_IMAGE:-mailflow-worker:local}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: worker
    environment:
      MAILFLOW_CDN_ROOT: /data/cdn
      MAILFLOW_CDN_MAX_BYTES: 26214400
      MAILFLOW_CDN_CLEANUP_INTERVAL: 24h
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      REDIS_ADDRESS: redis:6379
      MAILFLOW_MASTER_KEY_FILE: /run/secrets/master_key
      MAILFLOW_QUEUE_PREFIX: mailflow
      MAILFLOW_QUEUE_CLAIM_TIMEOUT: 6m
      MAILFLOW_QUEUE_HANDLE_TIMEOUT: 5m
      MAILFLOW_QUEUE_SHUTDOWN_GRACE: 15s
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
      GOOGLE_OAUTH_REDIRECT_URL: https://${MAILFLOW_DOMAIN}/api/v1/oauth/google/callback
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET_FILE: /run/secrets/microsoft_oauth_client_secret
      MICROSOFT_OAUTH_REDIRECT_URL: https://${MAILFLOW_DOMAIN}/api/v1/oauth/microsoft/callback
      MICROSOFT_OAUTH_AUTHORITY: ${MICROSOFT_OAUTH_AUTHORITY:-common}
      MAILFLOW_IMAP_ACCOUNT_REFRESH: ${MAILFLOW_IMAP_ACCOUNT_REFRESH:-30s}
      MAILFLOW_IMAP_IDLE_HEARTBEAT: ${MAILFLOW_IMAP_IDLE_HEARTBEAT:-25m}
      MAILFLOW_IMAP_POLL_INTERVAL: ${MAILFLOW_IMAP_POLL_INTERVAL:-5m}
      MAILFLOW_IMAP_RECONNECT_MIN: ${MAILFLOW_IMAP_RECONNECT_MIN:-1s}
      MAILFLOW_IMAP_RECONNECT_MAX: ${MAILFLOW_IMAP_RECONNECT_MAX:-1m}
      MAILFLOW_IMAP_LEASE_RENEW: ${MAILFLOW_IMAP_LEASE_RENEW:-30s}
      MAILFLOW_IMAP_BURST_WINDOW: ${MAILFLOW_IMAP_BURST_WINDOW:-1s}
      MAILFLOW_IMAP_MAX_CONNECTIONS: ${MAILFLOW_IMAP_MAX_CONNECTIONS:-4}
      MAILFLOW_ALERT_SMTP_HOST: ${MAILFLOW_ALERT_SMTP_HOST:-}
      MAILFLOW_ALERT_SMTP_PORT: ${MAILFLOW_ALERT_SMTP_PORT:-587}
      MAILFLOW_ALERT_SMTP_USERNAME: ${MAILFLOW_ALERT_SMTP_USERNAME:-}
      MAILFLOW_ALERT_SMTP_FROM: ${MAILFLOW_ALERT_SMTP_FROM:-}
      MAILFLOW_ALERT_SMTP_TO: ${MAILFLOW_ALERT_SMTP_TO:-}
      MAILFLOW_ALERT_SMTP_IMPLICIT_TLS: ${MAILFLOW_ALERT_SMTP_IMPLICIT_TLS:-false}
      MAILFLOW_ALERT_CONNECTED_ACCOUNT_FALLBACK: ${MAILFLOW_ALERT_CONNECTED_ACCOUNT_FALLBACK:-false}
      MAILFLOW_ALERT_SMTP_PASSWORD_FILE: /run/secrets/alert_smtp_password
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - mailflow-cdn:/data/cdn
    secrets: [alert_smtp_password, google_oauth_client_secret, master_key, microsoft_oauth_client_secret, postgres_password]
    restart: unless-stopped

  postgres-preflight:
    image: postgres:18-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ]; then
          echo >&2 "Legacy PostgreSQL volume layout detected at /var/lib/postgresql."
          echo >&2 "Run a documented pg_dump/restore or pg_upgrade migration before PostgreSQL 18."
          exit 1
        fi
    volumes:
      - postgres-data:/var/lib/postgresql:ro
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    depends_on:
      postgres-preflight: { condition: service_completed_successfully }
    volumes:
      # PostgreSQL 18 stores clusters in versioned subdirectories so major
      # upgrades can use pg_upgrade without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mailflow -d mailflow]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    image: ${MAILFLOW_BACKUP_IMAGE:-mailflow-backup:local}
    build:
      context: ..
      dockerfile: services/api/backup.Dockerfile
    profiles: [backup]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      MAILFLOW_CDN_ROOT: /data/cdn
      MAILFLOW_MASTER_KEY_FILE: /run/secrets/master_key
      MAILFLOW_BACKUP_ENABLED: ${MAILFLOW_BACKUP_ENABLED:-true}
      MAILFLOW_BACKUP_SCHEDULE: ${MAILFLOW_BACKUP_SCHEDULE:-03:00}
      MAILFLOW_BACKUP_TIMEZONE: ${MAILFLOW_BACKUP_TIMEZONE:-UTC}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    secrets: [postgres_password, restic_password, master_key]
    volumes:
      - backup-staging:/backup/source
      - mailflow-cdn:/data/cdn:ro
      - ${BACKUP_PATH:-./backups}:/repository
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

secrets:
  better_auth_secret:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/better_auth_secret
  bootstrap_token:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/bootstrap_token
  recovery_code:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/recovery_code
  postgres_password:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/postgres_password
  restic_password:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/restic_password
  master_key:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/master_key
  google_oauth_client_secret:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/google_oauth_client_secret
  microsoft_oauth_client_secret:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/microsoft_oauth_client_secret
  alert_smtp_password:
    file: ${MAILFLOW_SECRETS_PATH:-./secrets}/alert_smtp_password

volumes:
  traefik-acme:
  postgres-data:
  redis-data:
  mailflow-cdn:
  backup-staging:
