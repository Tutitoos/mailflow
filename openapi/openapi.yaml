openapi: 3.1.0
info:
  title: Mailflow API
  version: 0.1.0
  description: Stable public contract shared by the web, desktop and future Swift clients.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Canonical Mailflow user for the authenticated token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/sync:
    post:
      operationId: synchronizeAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Synchronization queued or already pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRunAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/refresh:
    post:
      operationId: refreshGoogleAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account credentials refreshed without exposing provider tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}:
    delete:
      operationId: disconnectAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Local access disabled and remote revocation attempted
          content:
            application/json:
              schema:
                type: object
                required: [account, remoteRevoked]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  remoteRevoked: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /oauth/google/status:
    get:
      operationId: getGoogleOAuthStatus
      responses:
        "200":
          description: Per-installation Google OAuth capability
          content:
            application/json:
              schema:
                type: object
                required: [configured, setup]
                properties:
                  configured: { type: boolean }
                  setup: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
  /oauth/google/start:
    post:
      operationId: startGoogleOAuth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reconsent: { type: boolean, default: false }
      responses:
        "200":
          description: Short-lived single-use authorization transaction
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /oauth/google/callback:
    get:
      operationId: completeGoogleOAuth
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "303":
          description: Connection completed and browser redirected to account settings
        "400": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /events:
    get:
      operationId: streamEvents
      description: Upgrade to an authenticated WebSocket. Reconnect with the last acknowledged cursor to replay missed events.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+$"
      responses:
        "101": { description: WebSocket event stream using EventEnvelope messages }
        "401": { $ref: "#/components/responses/Problem" }
        "426": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /threads:
    get:
      operationId: listThreads
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
        - name: category
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MailCategory" }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPage"
        default: { $ref: "#/components/responses/Problem" }
  /mailboxes:
    get:
      operationId: listMailboxes
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Mailboxes for one owned account
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
        default: { $ref: "#/components/responses/Problem" }
  /labels:
    get:
      operationId: listLabels
      parameters:
        - $ref: "#/components/parameters/AccountIdQuery"
      responses:
        "200":
          description: Labels and category counters for one owned account
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Label" } }
        default: { $ref: "#/components/responses/Problem" }
  /threads/{threadId}:
    get:
      operationId: getThread
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Conversation and messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        default: { $ref: "#/components/responses/Problem" }
  /search:
    get:
      operationId: searchMail
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Account-scoped local search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        default: { $ref: "#/components/responses/Problem" }
  /actions:
    post:
      operationId: createMailAction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMailActions" }
      responses:
        "202":
          description: Actions accepted, including any per-target partial failures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailActionBatch" }
        default: { $ref: "#/components/responses/Problem" }
  /drafts:
    post:
      operationId: saveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftWrite" }
      responses:
        "201":
          description: Local draft saved and scheduled for a remote checkpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
  /drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDraft
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-scoped draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftWrite" }
      responses:
        "200":
          description: Draft updated at the expected local revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: discardDraft
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Draft explicitly discarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
  /drafts/{draftId}/checkpoint:
    post:
      operationId: checkpointDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: string, format: uuid }
      responses:
        "200":
          description: Draft checkpointed with its provider or already current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Problem" }
  /send:
    post:
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, draftId, expectedRevision]
              properties:
                accountId: { type: string, format: uuid }
                draftId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "202":
          description: Delivery recorded; ambiguous results are never retried with the same key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        default: { $ref: "#/components/responses/Problem" }
  /attachments:
    post:
      operationId: uploadDraftAttachment
      description: Stores one owner-scoped composer attachment within the installation limit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accountId, file]
              properties:
                accountId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Attachment stored for use by a draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAttachment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      description: Streams an authenticated message attachment, recovering an absent or expired Gmail cache entry without changing the attachment ID.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string, example: bytes=0-1023 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Complete attachment stream
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            ETag: { schema: { type: string } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "206":
          description: Requested single byte range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "304": { description: Cached representation is unchanged }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "416": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /translations/{locale}:
    get:
      operationId: getTranslations
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string, enum: [en, es] }
      responses:
        "200": { description: Translation catalog with English fallback }
  /admin/status:
    get:
      operationId: getAdminStatus
      responses:
        "200": { description: Operational status }
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      responses:
        "200": { description: Internal metric series }
  /admin/logs:
    get:
      operationId: getAdminLogs
      responses:
        "200": { description: Redacted structured logs }
  /admin/sentry:
    get:
      operationId: getSentryIssues
      responses:
        "200": { description: Grouped Sentry issues }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountIdQuery:
      name: accountId
      in: query
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CurrentUser:
      type: object
      required: [id, email, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        locale: { type: string, enum: [en, es] }
    Account:
      type: object
      required: [id, provider, remoteId, displayName, capabilities, syncState, disabledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, microsoft, imap] }
        remoteId: { type: string }
        displayName: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        syncState: { type: string, enum: [pending, syncing, idle, error, disabled] }
        disabledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SyncRunAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [queued, already_queued] }
        runId: { type: string, format: uuid }
    EventEnvelope:
      type: object
      required: [version, cursor, type, timestamp, payload]
      properties:
        version: { type: integer, const: 1 }
        cursor: { type: string, pattern: "^[0-9]+-[0-9]+$" }
        type:
          type: string
          enum: [mail.changed, sync.progress, draft.changed, admin.alert, system.status, system.resync_required]
        timestamp: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    ThreadPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InboxThread" } }
        nextCursor: { type: [string, "null"] }
    MailCategory:
      type: string
      enum: [primary, promotions, social, notifications, forums]
    InboxThread:
      type: object
      required: [id, accountId, senderName, senderAddress, subject, preview, lastMessageAt, isRead, isStarred, isImportant, category, messageCount, attachmentCount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        senderName: { type: string }
        senderAddress: { type: string }
        subject: { type: string }
        preview: { type: string, maxLength: 240 }
        lastMessageAt: { type: string, format: date-time }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        isImportant: { type: boolean }
        category: { $ref: "#/components/schemas/MailCategory" }
        messageCount: { type: integer, minimum: 0 }
        attachmentCount: { type: integer, minimum: 0 }
    ConversationPage:
      type: object
      required: [thread, messages, nextCursor]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
        nextCursor: { type: [string, "null"] }
    Thread:
      type: object
      required: [id, accountId, lastMessageAt, isRead, isStarred, isImportant, category, messageCount, unreadCount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        lastMessageAt: { type: string, format: date-time }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        isImportant: { type: boolean }
        category: { $ref: "#/components/schemas/MailCategory" }
        messageCount: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
    ConversationMessage:
      type: object
      required: [id, threadId, accountId, subject, bodyText, bodyHtml, sentAt, isRead, isStarred, isImportant, addresses, attachments]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        subject: { type: string }
        bodyText: { type: string }
        bodyHtml:
          type: string
          description: Server-sanitized HTML. Remote image URLs remain inert in data-mailflow-src until explicit client authorization.
        sentAt: { type: string, format: date-time }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        isImportant: { type: boolean }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/MessageAddress" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/MessageAttachment" }
    MessageAddress:
      type: object
      required: [role, position, displayName, address]
      properties:
        role: { type: string, enum: [from, sender, reply_to, to, cc, bcc] }
        position: { type: integer, minimum: 0 }
        displayName: { type: [string, "null"] }
        address: { type: string, format: email }
    SearchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        nextCursor: { type: [string, "null"] }
    SearchResult:
      type: object
      required: [id, threadId, accountId, senderName, senderAddress, subject, preview, sentAt, isRead, isStarred, isImportant, hasAttachment, attachmentCount, rank]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        senderName: { type: string }
        senderAddress: { type: string, format: email }
        subject: { type: string }
        preview: { type: string, maxLength: 240 }
        sentAt: { type: string, format: date-time }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        isImportant: { type: boolean }
        hasAttachment: { type: boolean }
        attachmentCount: { type: integer, minimum: 0 }
        rank: { type: number, format: float, minimum: 0 }
    CreateMailActions:
      type: object
      required: [accountId, kind, targetIds]
      properties:
        accountId: { type: string, format: uuid }
        kind:
          type: string
          enum: [mark_read, mark_unread, star, unstar, mark_important, mark_unimportant, move_to_trash, restore_from_trash, archive, add_label, remove_label]
        targetIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        labelId: { type: string, format: uuid }
    MailActionBatch:
      type: object
      required: [items, partial]
      properties:
        partial: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [targetId]
            properties:
              targetId: { type: string, format: uuid }
              actionId: { type: string, format: uuid }
              status: { type: string, enum: [pending, processing, retry_wait, completed, conflict] }
              created: { type: boolean }
              error: { type: string }
    DraftWrite:
      type: object
      required: [accountId, subject, bodyText, bodyHtml, recipients, attachments, mode]
      properties:
        accountId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 1 }
        subject: { type: string, maxLength: 1048576 }
        bodyText: { type: string, maxLength: 10485760 }
        bodyHtml: { type: string, maxLength: 10485760 }
        recipients:
          type: array
          maxItems: 512
          items:
            type: object
            required: [role, address]
            properties:
              role: { type: string, enum: [to, cc, bcc] }
              displayName: { type: string, maxLength: 256 }
              address: { type: string, format: email, maxLength: 1024 }
        attachments:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/DraftAttachment" }
        mode: { type: string, enum: [new, reply, forward] }
        sourceMessageId: { type: string, format: uuid }
    Draft:
      type: object
      required: [id, accountId, subject, bodyText, bodyHtml, recipients, attachments, mode, localRevision, syncedRevision, syncStatus, remoteCheckpointAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        subject: { type: string }
        bodyText: { type: string }
        bodyHtml: { type: string }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/MessageAddress" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/DraftAttachment" }
        mode: { type: string, enum: [new, reply, forward] }
        sourceMessageId: { type: [string, "null"], format: uuid }
        localRevision: { type: integer, minimum: 1 }
        syncedRevision: { type: integer, minimum: 0 }
        syncStatus: { type: string, enum: [queued, syncing, synced, conflict, discarded] }
        remoteCheckpointAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Delivery:
      type: object
      required: [id, accountId, draftId, status]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        status: { type: string, enum: [prepared, sending, sent, ambiguous] }
        remoteId: { type: [string, "null"] }
    DraftAttachment:
      type: object
      required: [objectId, filename, mediaType, sizeBytes]
      properties:
        objectId: { type: string, pattern: "^[0-9a-f]{32}$" }
        filename: { type: [string, "null"], maxLength: 1024 }
        mediaType: { type: string, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 0 }
    MessageAttachment:
      type: object
      required: [id, position, filename, mediaType, disposition, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        filename: { type: [string, "null"] }
        mediaType: { type: string }
        disposition: { type: string, enum: [attachment, inline] }
        sizeBytes: { type: integer, minimum: 0 }
    Mailbox:
      type: object
      required: [id, accountId, remoteId, remoteName, localName, role, selectable, totalCount, unreadCount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        remoteId: { type: string }
        remoteName: { type: string }
        localName: { type: [string, "null"] }
        role: { type: string, enum: [inbox, sent, drafts, trash, junk, archive, all] }
        selectable: { type: boolean }
        totalCount: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
    Label:
      type: object
      required: [id, accountId, remoteId, remoteName, localName, kind, category, color, totalCount, unreadCount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        remoteId: { type: [string, "null"] }
        remoteName: { type: string }
        localName: { type: [string, "null"] }
        kind: { type: string, enum: [system, user, category] }
        category:
          anyOf:
            - { $ref: "#/components/schemas/MailCategory" }
            - { type: "null" }
        color: { type: [string, "null"] }
        totalCount: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code, detail, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
