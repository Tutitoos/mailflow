name: mailflow

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${MAILFLOW_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=8080
    depends_on:
      api: { condition: service_healthy }
      auth: { condition: service_healthy }
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: "3001"
      BETTER_AUTH_URL: https://${MAILFLOW_DOMAIN}
      MAILFLOW_AUTH_AUDIENCE: mailflow-api
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      MAILFLOW_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      TRUSTED_ORIGINS: https://${MAILFLOW_DOMAIN}
    secrets: [better_auth_secret, bootstrap_token, postgres_password]
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${MAILFLOW_DOMAIN}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=letsencrypt
      - traefik.http.services.auth.loadbalancer.server.port=3001
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: [--migrate]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      MAILFLOW_API_ADDRESS: :8080
      MAILFLOW_CDN_ROOT: /data/cdn
      MAILFLOW_CDN_MAX_BYTES: 26214400
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
      MAILFLOW_AUTH_AUDIENCE: mailflow-api
      MAILFLOW_AUTH_ISSUER: https://${MAILFLOW_DOMAIN}
      MAILFLOW_MASTER_KEY_FILE: /run/secrets/master_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      REDIS_ADDRESS: redis:6379
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
      GOOGLE_OAUTH_REDIRECT_URL: https://${MAILFLOW_DOMAIN}/api/v1/oauth/google/callback
    secrets: [google_oauth_client_secret, master_key, postgres_password]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${MAILFLOW_DOMAIN}`) && (PathPrefix(`/api/v1`) || PathPrefix(`/sentry`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD, /usr/local/bin/api, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      auth: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - mailflow-cdn:/data/cdn
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    entrypoint: [/usr/local/bin/worker]
    environment:
      MAILFLOW_CDN_ROOT: /data/cdn
      MAILFLOW_CDN_MAX_BYTES: 26214400
      MAILFLOW_CDN_CLEANUP_INTERVAL: 24h
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_USER: mailflow
      POSTGRES_DB: mailflow
      REDIS_ADDRESS: redis:6379
      MAILFLOW_MASTER_KEY_FILE: /run/secrets/master_key
      MAILFLOW_QUEUE_PREFIX: mailflow
      MAILFLOW_QUEUE_CLAIM_TIMEOUT: 6m
      MAILFLOW_QUEUE_HANDLE_TIMEOUT: 5m
      MAILFLOW_QUEUE_SHUTDOWN_GRACE: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - mailflow-cdn:/data/cdn
    secrets: [master_key, postgres_password]
    restart: unless-stopped

  postgres-preflight:
    image: postgres:18-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ]; then
          echo >&2 "Legacy PostgreSQL volume layout detected at /var/lib/postgresql."
          echo >&2 "Run a documented pg_dump/restore or pg_upgrade migration before PostgreSQL 18."
          exit 1
        fi
    volumes:
      - postgres-data:/var/lib/postgresql:ro
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    depends_on:
      postgres-preflight: { condition: service_completed_successfully }
    volumes:
      # PostgreSQL 18 stores clusters in versioned subdirectories so major
      # upgrades can use pg_upgrade without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mailflow -d mailflow]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    image: restic/restic:0.18.1
    profiles: [backup]
    entrypoint: [restic]
    environment:
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
    secrets: [restic_password]
    volumes:
      # The worker writes a consistent pg_dump and manifest here. Restic must
      # never copy PostgreSQL's live data directory.
      - backup-staging:/backup/database:ro
      - mailflow-cdn:/backup/cdn:ro
      - ${BACKUP_PATH:-./backups}:/repository

secrets:
  better_auth_secret:
    file: ./secrets/better_auth_secret
  bootstrap_token:
    file: ./secrets/bootstrap_token
  postgres_password:
    file: ./secrets/postgres_password
  restic_password:
    file: ./secrets/restic_password
  master_key:
    file: ./secrets/master_key
  google_oauth_client_secret:
    file: ./secrets/google_oauth_client_secret

volumes:
  traefik-acme:
  postgres-data:
  redis-data:
  mailflow-cdn:
  backup-staging:
