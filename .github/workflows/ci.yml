name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate external repository lock
        run: ./scripts/repos-lock.sh validate

  web-and-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run generate
      - run: git diff --exit-code -- packages/api-client/src/generated

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mailflow_test
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mailflow:mailflow_test@127.0.0.1:5432/mailflow_test?sslmode=disable
      MAILFLOW_TEST_DATABASE_URL: postgres://mailflow:mailflow_test@127.0.0.1:5432/mailflow_test?sslmode=disable
      MAILFLOW_TEST_REDIS_ADDRESS: 127.0.0.1:6379
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/api/go.sum
      - run: go mod download
      - run: go tool sqlc generate
      - run: git diff --exit-code -- internal/platform/database/dbgen
      - run: ./scripts/test-integration.sh
        working-directory: .
      - run: go vet ./...
      - run: go run ./cmd/api --migrate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run --cwd services/auth test
        working-directory: .
        env:
          BETTER_AUTH_URL: http://localhost:3001
          BETTER_AUTH_SECRET: integration-secret-0123456789abcdef
          MAILFLOW_BOOTSTRAP_TOKEN: integration-bootstrap-token

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/web test:e2e

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
